<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Rock Paper Scissors</h2>

        <div class="image-box">
            <div class="player-card">
                <div class="avatar">🧑</div>
                <span>You</span>
            </div>
            <div class="vs-badge">VS</div>
            <div class="player-card">
                <div class="avatar">🤖</div>
                <span>CPU</span>
            </div>
        </div>

        <h3>Choose your weapon!</h3>

        <form action="{{ url_for('game') }}" method="POST">
            <button type="submit" id="rock" class="choice-btn" name="user_choise" value="Rock">
                <span class="btn-emoji">🪨</span> Rock
            </button>
            <button type="submit" id="paper" class="choice-btn" name="user_choise" value="Paper">
                <span class="btn-emoji">📄</span> Paper
            </button>
            <button type="submit" id="scissors" class="choice-btn" name="user_choise" value="Scissors">
                <span class="btn-emoji">✂️</span> Scissors
            </button>
        </form>
    </div>
</body>
</html>
